# Illustrative household in Texas, not the user's personal circumstances.
# Amounts are USD; the one-year example uses nominal tax-year 2026 dollars.
current_age: 35
retirement_age: 65
planning_end_age: 95
filing_status: single
working_state: TX
retirement_state: TX
annual_income: 100000
annual_after_tax_savings_budget: 15000
annual_retirement_spending: 60000
traditional_balance: 100000
roth_balance: 25000
taxable_balance: 10000
taxable_basis: 8000
# Illustrative combined employee limit, not a particular year's legal limit.
employee_contribution_limit: 24000
tax_year: 2026
# Paths resolve relative to this file. Reuse until explicitly replaced by a
# later effective-year snapshot; this is a scenario assumption, not a forecast.
tax_policy_files:
  - ../data/tax_policy/us_2026.yaml
roth_shares: [0.0, 0.5, 1.0]
random_seed: 42
scenario_count: 10000
